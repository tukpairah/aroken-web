<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бар-убежище</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            border: 4px solid #444;
            background: #000;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #inventory {
            pointer-events: auto;
        }

        #dialogBox {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.95);
            border: 4px solid #fff;
            padding: 20px;
            display: none;
            z-index: 10;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        #speakerName {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        #dialogText {
            font-size: 17px;
            line-height: 1.6;
            min-height: 80px;
            letter-spacing: 0.5px;
        }

        #dialogPrompt {
            text-align: right;
            font-size: 14px;
            margin-top: 10px;
            color: #888;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.3; }
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
        }

        #stats {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border: 3px solid #666;
            font-size: 15px;
            min-width: 200px;
        }

        #stats > div {
            margin: 5px 0;
        }

        .stat-label {
            color: #aaa;
            font-size: 13px;
        }

        .hp-bar {
            width: 180px;
            height: 24px;
            background: #2a0000;
            border: 2px solid #666;
            margin-top: 5px;
            position: relative;
            overflow: hidden;
        }

        .hp-fill {
            height: 100%;
            background: linear-gradient(to bottom, #ff3333, #cc0000);
            transition: width 0.5s ease;
            box-shadow: inset 0 0 10px rgba(255, 0, 0, 0.5);
        }

        .hp-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 13px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px #000;
        }

        #inventory {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border: 3px solid #666;
            font-size: 14px;
            min-width: 180px;
        }

        .inventory-title {
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 8px;
            border-bottom: 2px solid #444;
            padding-bottom: 5px;
        }

        .item {
            margin: 5px 0;
            padding: 5px;
            background: rgba(50, 50, 50, 0.5);
            border-left: 3px solid #666;
            padding-left: 8px;
            font-size: 13px;
        }

        .item-empty {
            color: #555;
            font-style: italic;
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 12px;
            border: 3px solid #666;
            font-size: 13px;
            max-width: 220px;
        }

        .key-hint {
            color: #ffd700;
            font-weight: bold;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            z-index: 5;
        }

        #startPopup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            font-family: 'Courier New';
        }

        #startPopup h1 {
            margin-bottom: 20px;
            font-size: 32px;
        }

        #startPopup button {
            padding: 12px 24px;
            margin: 10px;
            background: black;
            border: 2px solid white;
            color: white;
            cursor: pointer;
            font-size: 18px;
            font-family: 'Courier New';
            transition: all 0.3s;
        }

        #startPopup button:hover {
            background: white;
            color: black;
        }

        #newGameBtn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            padding: 10px 18px;
            background: rgba(0,0,0,0.8);
            border: 2px solid white;
            color: white;
            font-family: 'Courier New';
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="startPopup">
        <h1>Войти в бар?</h1>
        <button id="continueBtn">Продолжить</button>
        <button id="newBtn">Новая игра</button>
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div class="vignette"></div>

        <div id="ui">
            <div id="stats">
                <div class="stat-label">ИМЯ</div>
                <div style="font-size: 18px; color: #ffd700; margin-bottom: 10px;">Странник</div>
                
                <div class="stat-label">❤️ ЗДОРОВЬЕ</div>
                <div class="hp-bar">
                    <div class="hp-fill" id="hpBar" style="width: 100%"></div>
                    <div class="hp-text"><span id="playerHP">20</span>/<span id="maxHP">20</span></div>
                </div>
                
                <div style="margin-top: 12px;">
                    <span class="stat-label">⚡ РЕШИМОСТЬ:</span> 
                    <span style="color: #ffaa00; font-weight: bold;" id="determination">0</span>
                </div>
                
                <div style="margin-top: 8px;">
                    <span class="stat-label">🕯️ ВОЛЯ:</span> 
                    <span style="color: #66ccff;" id="will">100</span>%
                </div>
            </div>

            <div id="inventory">
                <div class="inventory-title">📦 ИНВЕНТАРЬ</div>
                <div id="inventoryItems">
                    <div class="item item-empty">Пусто</div>
                    <div class="item item-empty">Пусто</div>
                    <div class="item item-empty">Пусто</div>
                </div>
            </div>

            <div id="instructions">
                <span class="key-hint">Стрелки</span> - движение<br>
                <span class="key-hint">E</span> / <span class="key-hint">Пробел</span> - взаимодействие
                <span class="key-hint">Q</span> / - пропустить диалог
            </div>
        </div>

        <div id="dialogBox">
            <div id="speakerName">Даниил</div>
            <div id="dialogText"></div>
            <div id="dialogPrompt">▼ Нажми E чтобы продолжить</div>
        </div>
    </div>

    <button id="newGameBtn">Новая игра</button>

    <audio id="bgMusic" src="Berserk2.mp3" loop preload="auto"></audio>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const game = {
            started: false,
            mode: 'explore',
            player: {
                x: 400,
                y: 550,
                speed: 2.5,
                hp: 20,
                maxHp: 20,
                determination: 0,
                will: 100,
                inventory: []
            },
            keys: {},
            npcs: [],
            doors: [],
            dialogs: {},
            currentDialog: null,
            dialogIndex: 0,
            textSpeed: 50,
            currentText: '',
            targetText: '',
            textTimer: null
        };

        game.loadPlayerState = function() {
            const saved = localStorage.getItem('playerState');
            if (saved) {
                const state = JSON.parse(saved);
                this.player.hp = state.hp || 20;
                this.player.maxHp = state.maxHp || 20;
                this.player.determination = state.determination || 0;
                this.player.will = state.will || 100;
                this.player.inventory = state.inventory || [];
                
                document.getElementById('playerHP').textContent = this.player.hp;
                document.getElementById('maxHP').textContent = this.player.maxHp;
                document.getElementById('determination').textContent = this.player.determination;
                document.getElementById('will').textContent = this.player.will;
                
                const hpPercent = (this.player.hp / this.player.maxHp) * 100;
                document.getElementById('hpBar').style.width = hpPercent + '%';
                
                this.updateInventoryUI();
            }
        };

        game.savePlayerState = function() {
            const state = {
                hp: this.player.hp,
                maxHp: this.player.maxHp,
                determination: this.player.determination,
                will: this.player.will,
                inventory: this.player.inventory
            };
            localStorage.setItem('playerState', JSON.stringify(state));
        };

        game.updateInventoryUI = function() {
            const container = document.getElementById('inventoryItems');
            container.innerHTML = '';
            
            for (let i = 0; i < 1; i++) {
                const div = document.createElement('div');
                div.className = 'item';
                
                if (this.player.inventory[i]) {
                    div.className = 'item';

                    if (this.player.inventory[i].type === 'video') {
                        const a = document.createElement('a');
                        a.href = this.player.inventory[i].url;
                        a.textContent = this.player.inventory[i].name;
                        a.target = "_blank";
                        a.style.color = "#ffd700";
                        a.style.textDecoration = "none";
                        a.style.cursor = "pointer";
                        div.appendChild(a);
                    } else {
                        div.textContent = this.player.inventory[i].name;
                    }
                } else {
                    div.className = 'item item-empty';
                    div.textContent = 'Пусто';
                }
                
                container.appendChild(div);
            }
        };

        game.addItem = function(itemName) {
            if (this.player.inventory.length < 1) {
                this.player.inventory.push(itemName);
                this.updateInventoryUI();
                this.savePlayerState();
                return true;
            }
            return false;
        };

        game.initWorld = function() {
            this.npcs = [
                { 
                    x: 400, 
                    y: 200, 
                    type: 'daniil', 
                    name: 'Даниил', 
                    emoji: '🤵‍♂️',
                    talked: false,
                    scale: 1.5
                }
            ];

            this.doors = [
                { x: 400, y: 40, w: 120, h: 30, open: false, target: 'room_boss1.html' }
            ];

            this.dialogs = {
                daniil: [
                    "Эй, Странник!",
                    "Добро пожаловать в последнее безопасное место.",
                    "Я — Даниил. Можно сказать, твой сопровождающий.",
                    "Здесь ты можешь перевести дух перед тем, как...",
                    "...",
                    "Ну, перед тем, как всё станет по-настоящему тяжело.",
                    "...",
                    "Слушай, я не буду тебя пугать.",
                    "Но то, что впереди — это не шутки.",
                    "Там твои внутренние демоны. Настоящие.",
                    "Прокрастинация. Лень. Страхи. Сомнения.",
                    "Каждый из них сильнее, чем ты думаешь.",
                    "...",
                    "Но у меня есть кое-что для тебя.",
                    "Это не меч. Не зелье. Не заклинание.",
                    "Это... знание.",
                    "...",
                    "Вот, держи.",
                    "*Даниил протягивает тебе ссылку*",
                    "Это видео. YouTube-наставление.",
                    "Когда выберешься отсюда — обязательно посмотри.",
                    "Там то, что поможет тебе понять суть твоего пути.",
                    "...",
                    "Запомни, Странник:",
                    "Демоны — это не враги. Это ты сам.",
                    "Части тебя, которые ты отвергал.",
                    "Ты можешь драться с ними. Но это не выход.",
                    "...",
                    "Настоящая сила — в принятии.",
                    "Понять их. Услышать. Интегрировать.",
                    "Только так ты вернешь себе ПРАЙМ-РЕЖИМ.",
                    "...",
                    "Ну всё, хватит лекций.",
                    "Дверь наверх открыта. Удачи там.",
                    "И помни — я верю в тебя."
                ]
            };
        };

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            game.keys[key] = true;
            
            if (key === 'e' || key === ' ') {
                e.preventDefault();
                if (game.mode === 'explore') {
                    game.checkInteraction();
                } else if (game.mode === 'dialog') {
                    game.advanceDialog();
                }
            }
            
            if (game.mode === 'dialog' && key === 'q') {
                e.preventDefault();
                game.skipDialog();
                return;
            }
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            game.keys[key] = false;
        });

        game.checkInteraction = function() {
            for (let npc of this.npcs) {
                const dx = this.player.x - npc.x;
                const dy = this.player.y - npc.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < 80) {
                    this.startDialog(npc);
                    return;
                }
            }

            for (let door of this.doors) {
                if (!door.open) continue;
                const dx = Math.abs(this.player.x - door.x);
                const dy = Math.abs(this.player.y - door.y);
                if (dx < door.w/2 + 30 && dy < door.h/2 + 30) {
                    this.savePlayerState();
                    window.location.href = door.target;
                    return;
                }
            }
        };

        game.startDialog = function(npc) {
            this.mode = 'dialog';
            this.currentDialog = npc;
            this.dialogIndex = 0;
            npc.talked = true;
            
            document.getElementById('dialogBox').style.display = 'block';
            document.getElementById('speakerName').textContent = npc.name;
            
            this.showDialogText();
        };

        game.showDialogText = function() {
            const dialogKey = this.currentDialog.type;
            const dialogs = this.dialogs[dialogKey];
            
            if (this.dialogIndex < dialogs.length) {
                this.targetText = dialogs[this.dialogIndex];
                this.currentText = '';
                this.typeText();
            }
        };

        game.typeText = function() {
            if (this.currentText.length < this.targetText.length) {
                this.currentText = this.targetText.substring(0, this.currentText.length + 1);
                document.getElementById('dialogText').textContent = this.currentText;
                
                this.textTimer = setTimeout(() => this.typeText(), this.textSpeed);
            }
        };

        game.advanceDialog = function() {
            if (this.currentText.length < this.targetText.length) {
                clearTimeout(this.textTimer);
                this.currentText = this.targetText;
                document.getElementById('dialogText').textContent = this.currentText;
                return;
            }
            
            this.dialogIndex++;
            const dialogKey = this.currentDialog.type;
            const dialogs = this.dialogs[dialogKey];
            
            if (this.dialogIndex < dialogs.length) {
                this.showDialogText();
            } else {
                this.endDialog();
            }
        };

        game.skipDialog = function() {
            const finishedNpc = this.currentDialog;

            this.mode = 'explore';
            document.getElementById('dialogBox').style.display = 'none';
            this.currentDialog = null;

            if (finishedNpc && finishedNpc.type === 'daniil') {
                this.addItem({
                    type: 'video',
                    name: '🎥 Видео-наставление',
                    url: 'https://youtu.be/KfwPcCz6aF8?si=PEnn-8Fen5-AaZyT'
                });

                this.player.determination += 2;
                document.getElementById('determination').textContent = this.player.determination;
                this.player.will = 100;
                document.getElementById('will').textContent = this.player.will;
                this.doors.forEach(d => d.open = true);
                this.savePlayerState();
            }
        };

        game.endDialog = function() {
            const finishedNpc = this.currentDialog;

            this.mode = 'explore';
            document.getElementById('dialogBox').style.display = 'none';
            this.currentDialog = null;
            
            if (finishedNpc && finishedNpc.type === 'daniil') {
                this.addItem({
                    type: 'video',
                    name: '🎥 Видео-наставление',
                    url: 'https://youtu.be/KfwPcCz6aF8?si=PEnn-8Fen5-AaZyT'
                });
                
                this.player.determination += 2;
                document.getElementById('determination').textContent = this.player.determination;
                
                this.player.will = 100;
                document.getElementById('will').textContent = this.player.will;
                
                this.doors.forEach(d => d.open = true);
                
                this.savePlayerState();
            }
        };

        function drawBar() {
            ctx.fillStyle = '#3d2817';
            ctx.fillRect(250, 220, 300, 40);
            
            ctx.fillStyle = '#5a3d2b';
            ctx.fillRect(250, 220, 300, 10);
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(250, 258, 300, 5);
            
            for (let i = 0; i < 1; i++) {
                ctx.fillStyle = '#2d1810';
                ctx.fillRect(280, 100 + i * 30, 240, 8);
            }
            
            ctx.font = '20px Arial';
            const bottles = ['🍺', '🍷', '🍾', '🥃', '🍻'];
            for (let i = 0; i < bottles.length; i++) {
                ctx.fillText(bottles[i], 300 + i * 50, 110);
            }
        }

        function drawLighting() {
            const gradient = ctx.createRadialGradient(400, 300, 50, 400, 300, 250);
            gradient.addColorStop(0, 'rgba(255, 200, 100, 0.1)');
            gradient.addColorStop(1, 'rgba(255, 200, 100, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        let time = 0;
        function gameLoop() {
            if (!game.started) {
                requestAnimationFrame(gameLoop);
                return;
            }

            time += 0.016;

            if (game.mode === 'explore') {
                if (game.keys['w'] || game.keys['arrowup']) {
                    game.player.y -= game.player.speed;
                }
                if (game.keys['s'] || game.keys['arrowdown']) {
                    game.player.y += game.player.speed;
                }
                if (game.keys['a'] || game.keys['arrowleft']) {
                    game.player.x -= game.player.speed;
                }
                if (game.keys['d'] || game.keys['arrowright']) {
                    game.player.x += game.player.speed;
                }

                game.player.x = Math.max(40, Math.min(canvas.width - 40, game.player.x));
                game.player.y = Math.max(40, Math.min(canvas.height - 40, game.player.y));
            }

            ctx.fillStyle = '#1a0f0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#2d1810';
            for (let i = 0; i < canvas.width; i += 100) {
                for (let j = 0; j < canvas.height; j += 20) {
                    ctx.fillRect(i, j, 95, 18);
                }
            }

            ctx.fillStyle = '#1a0f0a';
            ctx.fillRect(0, 0, canvas.width, 80);
            ctx.fillRect(0, 0, 80, canvas.height);
            ctx.fillRect(canvas.width - 80, 0, 80, canvas.height);

            drawBar();
            drawLighting();

            for (let door of game.doors) {
                if (!door.open) {
                    ctx.fillStyle = '#4a2b2b';
                } else {
                    ctx.fillStyle = '#2e8b57';
                }
                ctx.fillRect(door.x - door.w/2, door.y - door.h/2, door.w, door.h);
                
                ctx.strokeStyle = door.open ? 'rgba(100, 255, 100, 0.5)' : 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = 2;
                ctx.strokeRect(door.x - door.w/2, door.y - door.h/2, door.w, door.h);
                
                if (door.open) {
                    const dx = Math.abs(game.player.x - door.x);
                    const dy = Math.abs(game.player.y - door.y);
                    if (dx < 100 && dy < 100) {
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                        ctx.font = '16px Courier New';
                        ctx.textAlign = 'center';
                        ctx.fillText('[E] Войти', door.x, door.y - 40);
                        ctx.textAlign = 'left';
                    }
                }
            }

            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            for (let npc of game.npcs) {
                ctx.beginPath();
                ctx.ellipse(npc.x, npc.y + 35, 25, 10, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.beginPath();
            ctx.ellipse(game.player.x, game.player.y + 30, 20, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            for (let npc of game.npcs) {
                ctx.font = `${48 * (npc.scale || 1)}px Arial`;
                ctx.fillText(npc.emoji, npc.x - 24 * (npc.scale || 1), npc.y + 16);
                
                const dx = game.player.x - npc.x;
                const dy = game.player.y - npc.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < 80 && game.mode === 'explore') {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                    ctx.font = '20px Courier New';
                    ctx.fillText('[E]', npc.x - 15, npc.y - 50);
                    
                    ctx.font = '16px Courier New';
                    ctx.fillStyle = '#ffd700';
                    ctx.textAlign = 'center';
                    ctx.fillText(npc.name, npc.x, npc.y - 70);
                    ctx.textAlign = 'left';
                }
            }

            ctx.font = '40px Arial';
            ctx.fillText('🙂', game.player.x - 20, game.player.y + 20);

            requestAnimationFrame(gameLoop);
        }

        game.loadPlayerState();
        game.initWorld();

        window.addEventListener("DOMContentLoaded", () => {
            const mus = document.getElementById("bgMusic");
            mus.volume = 0.6;

            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const context = new AudioContext();

            function unlockAudio() {
                if (context.state === "suspended") {
                    context.resume();
                }

                mus.play().then(() => {
                    console.log("Музыка запущена автоматически");
                }).catch(() => {
                    setTimeout(unlockAudio, 300);
                });
            }

            unlockAudio();
        });

        const startPopup = document.getElementById("startPopup");
        const contBtn = document.getElementById("continueBtn");
        const newBtn = document.getElementById("newBtn");

        contBtn.onclick = () => {
            startPopup.style.display = "none";
            game.started = true;

            const mus = document.getElementById("bgMusic");
            mus.volume = 0.6;
            mus.play().catch(()=>{});
        };

        newBtn.onclick = () => {
            localStorage.clear();
            startPopup.style.display = "none";
            game.started = true;

            const mus = document.getElementById("bgMusic");
            mus.volume = 0.6;
            mus.play().catch(()=>{});
        };

        gameLoop();

        document.getElementById("newGameBtn").onclick = () => {
            localStorage.clear();
            window.location.reload();
        };
    </script>
</body>
</html>
